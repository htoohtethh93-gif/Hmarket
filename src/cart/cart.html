<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H MARKET — Cart</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="./cart.css">
</head>
<body>
  <main class="cart-page">
    <header class="cart-top">
      <button id="backBtn" class="icon-btn">←</button>
      <div><h1>🛒 Cart</h1><p>Your selected items</p></div>
    </header>

    <section id="cartList" class="cart-list"></section>

    <section id="emptyState" class="empty">
      <div>🛒</div>
      <h2>Cart is empty</h2>
      <p>Shop ထဲက ပစ္စည်းတွေကို Add to Cart လုပ်ပါ။</p>
      <button id="shopBtn" class="primary-btn">Start Shopping</button>
    </section>

    <section id="summary" class="summary hidden">
      <div class="summary-row"><span>Subtotal</span><b id="subtotal">0 MMK</b></div>
      <div class="summary-row"><span>Delivery Fee</span><b id="deliveryFee">0 MMK</b></div>
      <div class="summary-row total"><span>Total</span><b id="total">0 MMK</b></div>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    </section>
  
<nav class="bottom-nav">
  <a href="../customer/customer.html" class="nav-item">⌂<span>Home</span></a>
  <a href="../shop/shop.html" class="nav-item NAV_ACTIVE_SHOP">▣<span>Shop</span></a>
  <a href="../cart/cart.html" class="nav-item NAV_ACTIVE_CART">🛒<span>Cart</span></a>
  <a href="../account/account.html" class="nav-item">♙<span>Account</span></a>
</nav>
</main>
  <script src="../shared/config.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="./cart.js"></script>
</body>
</html>
